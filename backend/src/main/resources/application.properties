# ===================================================================
# CONFIGURACIÓN GENERAL DEL MICROSERVICIO
# ===================================================================
spring.application.name=backend
server.port=8080

# ===================================================================
# CONEXIÓN A LA BASE DE DATOS (XAMPP - MySQL)
# ===================================================================
# Reemplaza 'pagina_web_db' por el nombre exacto de la BD que creaste en phpMyAdmin
spring.datasource.url=jdbc:mysql://localhost:3306/pagina_web_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# CONFIGURACIÓN DE HIBERNATE / JPA
# ===================================================================
# 'update' crea las tablas automáticamente en XAMPP si no existen, o las actualiza sin borrar datos
spring.jpa.hibernate.ddl-auto=update
# Muestra en la consola de IntelliJ las consultas SQL reales que Spring ejecuta detrás de escena
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===================================================================
# CONFIGURACIÓN DE SWAGGER / OPENAPI
# ===================================================================
# Configura rutas ordenadas y limpias para acceder a la documentación
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha

# ===================================================================
# SEGURIDAD Y ACTUATOR
# ===================================================================
# Expone los endpoints de monitoreo de Actuator de forma segura
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
